name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Block fork PRs to main
        if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork PRs must target the 'develop' or feature branch, not 'main'. Please change the base branch of this PR."
          exit 1

  static-tests:
    needs: validate
    uses: wellsiau-abp-v2/central-repo/.github/workflows/tf-module-static-tests.yml@v1
    with:
      terraform-version: "1.14.8"  # Update to match your module's required_version
      # run-build-step: true  # Uncomment if your module has application code (e.g., Lambda)

  approve:
    needs: static-tests
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    environment: functional-test
    steps:
      - name: Approved
        run: echo "Static tests passed. Functional tests approved by reviewer."

  functional-tests:
    needs: approve
    if: github.base_ref == 'main'
    uses: aws-actions/configure-aws-credentials@v6
    with:
      role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
      aws-region: us-east-1
      role-session-name: functional-tests-pre-helper
    #uses: wellsiau-abp-v2/central-repo/.github/workflows/tf-module-functional-tests.yml@v1
    #with:
    #  terraform-version: "1.14.8"  # Update to match your module's required_version
      # run-build-step: true  # Uncomment if your module has application code (e.g., Lambda)
    #secrets: inherit
