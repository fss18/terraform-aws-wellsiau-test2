name: "TF Module — Functional Tests"

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform CLI version (default: latest)"
        type: string
        required: false
        default: "latest"
      run-build-step:
        description: "Run 'make all' before Terraform commands (default: false)"
        type: boolean
        required: false
        default: false
      aws-region:
        description: "Primary AWS region for functional tests (default: us-east-1)"
        type: string
        required: false
        default: "us-east-1"
      test-timeout-minutes:
        description: "Maximum duration in minutes for the terraform test step (default: 60)"
        type: number
        required: false
        default: 60
    secrets:
      AWS_OIDC_ROLE_ARN:
        description: "IAM role ARN for OIDC federation into the test account"
        required: false
    outputs:
      result:
        description: "Overall test result: pass or fail"
        value: ${{ jobs.functional-tests.outputs.result }}

permissions:
  id-token: write
  contents: read

jobs:
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-result.outputs.result }}
    steps:
      # 0. Check OIDC secret is available (fails gracefully on fork PRs)
      - name: Check OIDC credentials available
        shell: bash
        run: |
          if [ -z "${{ secrets.AWS_OIDC_ROLE_ARN }}" ]; then
            echo "::error::AWS_OIDC_ROLE_ARN secret is not available. This is expected for fork PRs — functional tests require repo secrets and cannot run from forks. Fork PRs must target the 'develop' branch where only static tests are required. Functional tests will run after the maintainer merges the PR to 'develop' in same-repo context."
            exit 1
          fi

      # 1. Authorization check (fail-fast)
      - name: Authorization check
        shell: bash
        run: |
          # Skip auth check for pull_request (environment approval gate handles authorization)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Event is pull_request — authorization delegated to environment approval gate."
            exit 0
          fi
          # Skip auth check for workflow_dispatch (already authorized via GitHub UI)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Event is workflow_dispatch — authorization check skipped (already authorized)."
            exit 0
          fi
          # For issue_comment trigger (if used), check author association
          AUTHOR_ASSOCIATION="${{ github.event.comment.author_association }}"
          echo "Comment author association: ${AUTHOR_ASSOCIATION}"
          if [ "${AUTHOR_ASSOCIATION}" = "OWNER" ] || [ "${AUTHOR_ASSOCIATION}" = "MEMBER" ] || [ "${AUTHOR_ASSOCIATION}" = "COLLABORATOR" ]; then
            echo "Authorization check passed: author is ${AUTHOR_ASSOCIATION}."
          else
            echo "::error::Authorization check failed. Only repository OWNER, MEMBER, or COLLABORATOR can trigger functional tests. Got: ${AUTHOR_ASSOCIATION}"
            exit 1
          fi

      # 2. Checkout module repo
      - name: Checkout module repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 4. Clean stale auto.tfvars from previous runs
      - name: Clean stale auto.tfvars
        shell: bash
        run: |
          if [ -f "tests/terraform.auto.tfvars" ]; then
            echo "Removing stale tests/terraform.auto.tfvars from previous run"
            rm -f tests/terraform.auto.tfvars
          fi

      # 5. Execute pre-entrypoint helper (isolated step with SSM read-only scoped credentials)
      - name: Check for pre-entrypoint helper
        id: pre-helper-check
        shell: bash
        run: |
          if [ -f ".config/functional_tests/pre-entrypoint-helpers.sh" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pre-entrypoint helper found at .config/functional_tests/pre-entrypoint-helpers.sh, skipping."
          fi

      - name: Acquire SSM read-only credentials for pre-entrypoint helper
        if: steps.pre-helper-check.outputs.exists == 'true'
        id: pre-helper-creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: functional-tests-pre-helper

      - name: Execute pre-entrypoint helper
        if: steps.pre-helper-check.outputs.exists == 'true'
        shell: bash
        run: |
          echo "::group::Pre-entrypoint helper script"
          echo "Starting pre-entrypoint helper: .config/functional_tests/pre-entrypoint-helpers.sh"
          chmod +x .config/functional_tests/pre-entrypoint-helpers.sh
          ./.config/functional_tests/pre-entrypoint-helpers.sh
          echo "Completed pre-entrypoint helper: .config/functional_tests/pre-entrypoint-helpers.sh"
          echo "::endgroup::"

      # 5. Optional build step
      - name: Run build step (make all)
        if: inputs.run-build-step == true
        shell: bash
        run: |
          echo "::group::Build step"
          echo "Starting build step: make all"
          make all
          echo "Completed build step: make all"
          echo "::endgroup::"

      # 6. OIDC credential acquisition for functional tests
      - name: Configure AWS credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: functional-tests

      # 8. Terraform CLI setup and execution
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform Init
        id: tf-init
        shell: bash
        run: |
          terraform init 2>&1 | tee /tmp/tf-init-output.txt
          TF_INIT_EXIT=${PIPESTATUS[0]}
          if [ $TF_INIT_EXIT -ne 0 ]; then
            echo "tf_init_output<<EOF" >> "$GITHUB_ENV"
            cat /tmp/tf-init-output.txt >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi
          exit $TF_INIT_EXIT
        env:
          AWS_REGION: ${{ inputs.aws-region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws-region }}

      - name: Terraform Test
        id: tf-test
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        shell: bash
        run: |
          terraform test 2>&1 | tee /tmp/tf-test-output.txt
          TF_TEST_EXIT=${PIPESTATUS[0]}
          echo "tf_test_output<<EOF" >> "$GITHUB_ENV"
          cat /tmp/tf-test-output.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          exit $TF_TEST_EXIT
        env:
          AWS_REGION: ${{ inputs.aws-region }}
          AWS_DEFAULT_REGION: ${{ inputs.aws-region }}

      # 9. Job Summary
      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          echo "## Functional Tests Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tf-init.outcome }}" = "success" ]; then
            echo "✅ **Terraform Init** — succeeded" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tf-init.outcome }}" = "failure" ]; then
            echo "❌ **Terraform Init** — failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$tf_init_output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ **Terraform Init** — skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.tf-test.outcome }}" = "success" ]; then
            echo "✅ **Terraform Test** — all tests passed" >> "$GITHUB_STEP_SUMMARY"
            TEST_COUNT=$(find tests/ -name '*.tftest.hcl' -type f 2>/dev/null | wc -l)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_${TEST_COUNT} test file(s) discovered and executed._" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tf-test.outcome }}" = "failure" ]; then
            echo "❌ **Terraform Test** — failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Test Output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$tf_test_output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tf-test.outcome }}" = "cancelled" ]; then
            echo "⏱️ **Terraform Test** — timed out after ${{ inputs.test-timeout-minutes }} minutes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ **Terraform Test** — skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.post-helper.outcome }}" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Cleanup** — post-entrypoint helper failed (test result preserved)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 10. Cleanup (post-entrypoint helper, runs regardless of test outcome)
      - name: Check for post-entrypoint helper
        if: always()
        id: post-helper-check
        shell: bash
        run: |
          if [ -f ".config/functional_tests/post-entrypoint-helpers.sh" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No post-entrypoint helper found at .config/functional_tests/post-entrypoint-helpers.sh, skipping."
          fi

      - name: Execute post-entrypoint helper
        if: always() && steps.post-helper-check.outputs.exists == 'true'
        id: post-helper
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          echo "::group::Post-entrypoint helper script"
          chmod +x .config/functional_tests/post-entrypoint-helpers.sh
          ./.config/functional_tests/post-entrypoint-helpers.sh
          echo "::endgroup::"

      # 11. Set overall result (based on test step outcome, not job.status)
      - name: Set result output
        id: set-result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.tf-test.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
